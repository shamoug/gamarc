<!DOCTYPE html>
<html lang="en" data-theme="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Nexus Arcade</title>
    <meta name="description" content="Nexus Arcade — a self-contained, offline browser arcade. Games: RIFT, LATTICE, PULSE, VECTOR, HELIX and QUANTA." />
    <!-- Mobile / PWA-ish hints (still fully self-contained, no network). -->
    <meta name="theme-color" content="#060912" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus Arcade" />
    <meta name="format-detection" content="telephone=no" />
    <!-- All styles are local; no external fonts or CDNs. -->
    <link rel="stylesheet" href="src/platform/ui.css" />
    <link rel="stylesheet" href="src/games/rift/rift.css" />
    <link rel="stylesheet" href="src/games/lattice/lattice.css" />
    <link rel="stylesheet" href="src/games/pulse/pulse.css" />
    <link rel="stylesheet" href="src/games/vector/vector.css" />
    <link rel="stylesheet" href="src/games/helix/helix.css" />
    <link rel="stylesheet" href="src/games/quanta/quanta.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%97%88%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <!-- ES modules require an http server. See README: python -m http.server -->
    <script type="module">
      import { boot } from './src/platform/shell.js';
      boot('app');
    </script>
    <noscript>
      <p style="color: #fff; text-align: center; padding: 40px">
        Nexus Arcade needs JavaScript enabled to run.
      </p>
    </noscript>
  </body>
</html>
